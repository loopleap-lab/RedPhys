[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redphys"
description = "RedPhys: A Unified Red-Teaming Benchmark for Physical-World VLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version", "dependencies"]

[project.urls]
Repository = "https://github.com/UCF-ML-Research/RedPhys"

[tool.setuptools.dynamic]
# Reuse requirements.txt; comment lines (e.g. the git-only installs) are ignored.
version = { attr = "redphys.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["redphys*"]
