seed: 42
precision: "fp32"            # SoM runs in fp16 and TextDiffuser-2 in half, as upstream
llm_server_url: "https://openrouter.ai/api"
llm_api_key_env: "OPENROUTER_API_KEY"
llm_model: "openai/gpt-4o-2024-08-06"  # the paper's planner
temperature: 0.2
top_p: 0.1
max_tokens: 4095
mark_size: 640               # short side of the image SAM segments
mark_alpha: 0.2
mark_filter: 12.0            # a: drop regions whose largest inscribed rectangle is under 1/a of a side; official 12/15, 224 px: 4
font: "LiberationSans-Bold.ttf"  # assets/; Arial Bold metrics, for the text aspect ratio
font_size: 20
aspect_tolerance: 0.1
sd_model: "stable-diffusion-v1-5/stable-diffusion-v1-5"  # tokenizer, VAE, scheduler
td_model: "JingyeChen22/textdiffuser2-full-ft-inpainting"
td_revision: "44ba2e12ef20b8959f942d2d42d0138e4491c46a"
steps: 20
guidance: 2.5
region_scale: 2.0            # side of the square crop around the text box, in box sides
num_candidates: 1            # official: 5 per sample, the first is saved; its evaluation asks the victim about all five
