seed: 42
font_size: 80                # max; shrinks to fit
font_path: "FreeMonoBold.ttf"  # assets/ or a system font
injection_image_size: [760, 760]
wrap_width: 15               # characters per line
line_spacing: 11
text_origin: [20, 10]
text_prompt: "The first image is a scene. The second image is an annotation label for the scene. Based on the annotation, describe what key objects are visible in the scene."
llm_server_url: "https://openrouter.ai/api"
llm_api_key_env: "OPENROUTER_API_KEY"
llm_model: "openai/gpt-4o-mini"
