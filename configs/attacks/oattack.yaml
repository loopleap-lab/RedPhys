epsilon: 16.0
seed: 42
precision: "bf16"           # or "fp32"
max_iterations: 300          # paper
alpha: 1.0                   # Adam lr
backbones:                   # name: HF CLIP id
  Laion: "laion/CLIP-ViT-g-14-laion2B-s12B-b42K"
  B16: "openai/clip-vit-base-patch16"
  B32: "openai/clip-vit-base-patch32"
image_layers: {Laion: 15, B16: 4, B32: 4}   # visual anchor blocks (last K)
text_layers: {Laion: 5, B16: 2, B32: 2}     # textual anchor blocks
dropout:                     # (p_start, p_end) cap schedule
  Laion: [0.10, 0.15]
  B16: [0.05, 0.10]
  B32: [0.05, 0.10]
input_res: 224
resize_source: false          # true: as upstream, the source is resized + center-cropped to input_res and the output has that size
views: 10                    # augmented views per step
source_crop_scale: [0.55, 0.95]
target_crop_scale: [0.9, 1.0]
crop_ratio: [0.75, 1.3333333333333333]  # x image W/H
text_alpha: 1.0
lambda_v: 1.0
lambda_t: 1.0
num_captions: 5
caption_model: "Qwen/Qwen2.5-VL-3B-Instruct"  # when no caption file covers an image
source_captions_path: null   # JSON [{"image": "<stem>.png", "caption": [...]}]
target_captions_path: null
