epsilon: 16.0
seed: 42
precision: "bf16"           # or "fp32"
max_iterations: 300          # paper
alpha: 1.0
momentum: 0.9                # MI-FGSM
clip_backbones:              # cross-modal alignment paradigm
  - "openai/clip-vit-base-patch16"
  - "openai/clip-vit-base-patch32"
  - "laion/CLIP-ViT-g-14-laion2B-s12B-b42K"
internvl_model: "OpenGVLab/InternVL3-1B-hf"  # MLLM paradigm + text generator
dino_model: "facebook/dinov2-base"           # visual self-supervised paradigm
describe_prompt: "Describe this image in one concise sentence, no longer than 20 words."
describe_max_tokens: 50
lam: 0.6                     # image vs text weight in the CLIP feature
tau: 0.2
omega: 2.0
input_res: 224
resize_source: false          # true: as upstream, the source is resized + center-cropped to input_res and the output has that size
crop_scale: [0.5, 0.9]
crop_ratio: [0.75, 1.3333333333333333]  # x image W/H
